
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    upstream integrated_koa2 {
        server integrated_koa2:8888;
    }

    server {
        listen       4343;
        server_name  localhost;


        # 【新增】专门处理 .json 文件的规则 (优先级高于下面的 location /)
        # 这样 version.json 就不会被应用 30天缓存，也不会被 try_files 干扰
        location = /test.json {
          # alias 不会拼接 URI，直接指向该文件
            alias /usr/share/nginx/html/test.json;
            
            # 强制禁用缓存
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            etag off;
            
            # 确保类型正确
            default_type application/json;
        }

	    location /ai {
            proxy_pass http://integrated_koa2/ai;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $proxy_add_x_forwarded_for; 
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off; # 如果是流式响应，建议关闭缓冲
            proxy_cache off;
        }

        # 直接服务静态文件  
        location / {  
            root   /usr/share/nginx/html;
            index  index.html;  

            # 使用缓存
            expires 30d; # 设置缓存有效期为30天
            add_header Cache-Control "public, max-age=2592000";

            # 如果请求的资源不存在，则重定向到 index.html
            try_files $uri $uri/ /index.html;
        } 
    }


